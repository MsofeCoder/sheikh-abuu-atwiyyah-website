backend:
  name: github
  repo: MsofeCoder/sheikh-abuu-atwiyyah-website
  branch: main
  base_url: https://abuuatwiyyah.netlify.app
  auth_endpoint: auth

# Where uploaded images/PDFs are stored in the repo, and the public
# path used to reference them on the live site.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "en"

collections:

  - name: "testimonials"
    label: "Testimonials"
    files:
      - file: "content/testimonials.json"
        label: "Testimonials List"
        name: "testimonials"
        fields:
          - label: "Testimonials"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

  - name: "resources"
    label: "Resources (Books, Articles, Audio/Video)"
    files:
      - file: "content/resources.json"
        label: "Resources List"
        name: "resources"
        fields:
          - label: "Resources"
            name: "items"
            widget: "list"
            summary: "{{fields.type}} — {{fields.title}}"
            fields:
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "PDF Book", value: "pdf" }
                  - { label: "Article", value: "makala" }
                  - { label: "Audio", value: "audio" }
                  - { label: "Video", value: "video" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Short Description", name: "description", widget: "text" }
              - label: "PDF File or Audio/Video Link (optional)"
                name: "url"
                widget: "file"
                required: false
                hint: "If you add a file, the button will open/download the resource directly in the browser (PDFs will download). If left empty, the button will request a copy via WhatsApp instead. Place book PDFs in assets/books/."

  - name: "posters"
    label: "Posters"
    files:
      - file: "content/posters.json"
        label: "Posters List"
        name: "posters"
        fields:
          - label: "Posters"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Poster Image (full size)", name: "image", widget: "image" }
              - { label: "Small/WebP Thumbnail (optional)", name: "thumb", widget: "image", required: false }
              - { label: "Description/Caption", name: "caption", widget: "string" }

  - name: "bookings"
    label: "Booking Calendar"
    files:
      - file: "content/bookings.json"
        label: "Booked Dates"
        name: "bookings"
        fields:
          - label: "Booked Dates (will show a lock icon)"
            name: "booked"
            widget: "booking-calendar"

  - name: "settings"
    label: "Site Settings (Working Hours)"
    files:
      - file: "content/settings.json"
        label: "Working Hours"
        name: "settings"
        fields:
          - label: "Working Hours"
            name: "hours"
            widget: "list"
            summary: "{{fields.day}} — {{fields.time}}"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Note (optional)", name: "note", widget: "string", required: false }
          - label: "Weekly Closed Days"
            name: "weeklyOff"
            widget: "select"
            multiple: true
            hint: "These days cannot be clicked on the booking calendar."
            options:
              - { label: "Sunday", value: 0 }
              - { label: "Monday", value: 1 }
              - { label: "Tuesday", value: 2 }
              - { label: "Wednesday", value: 3 }
              - { label: "Thursday", value: 4 }
              - { label: "Friday", value: 5 }
              - { label: "Saturday", value: 6 }
          - label: "Session Times (Time Slots)"
            name: "slots"
            widget: "list"
            hint: "These times are shown on the booking form after a date is chosen. Each item is a single slot, e.g. 9:00 – 10:00"
          - label: "Session Times for Specific Days (optional)"
            name: "slotByDay"
            widget: "list"
            required: false
            summary: "Day {{fields.weekday}} — {{fields.slots.length}} slots"
            hint: "Different times for certain days of the week. This schedule appears on the form after choosing that day's date. No entry for a day → the default schedule (slots) is used."
            fields:
              - label: "Day of Week (0=Sunday ... 6=Saturday)"
                name: "weekday"
                widget: "select"
                options:
                  - { label: "Sunday (0)", value: 0 }
                  - { label: "Monday (1)", value: 1 }
                  - { label: "Tuesday (2)", value: 2 }
                  - { label: "Wednesday (3)", value: 3 }
                  - { label: "Thursday (4)", value: 4 }
                  - { label: "Friday (5)", value: 5 }
                  - { label: "Saturday (6)", value: 6 }
              - label: "Time Slots"
                name: "slots"
                widget: "list"
                hint: "Each item is a single slot, e.g. 9:00 – 10:00"
          - label: "Session Times for Specific Dates (optional)"
            name: "dateSlots"
            widget: "list"
            required: false
            summary: "{{fields.date}}"
            hint: "Different times for specific dates (e.g. an event or special day). This schedule takes precedence over the per-day schedule (slotByDay)."
            fields:
              - label: "Date (YYYY-MM-DD)"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
              - label: "Time Slots"
                name: "slots"
                widget: "list"
                hint: "Each item is a single slot, e.g. 9:00 – 10:00"
          - label: "Sheikh's Photo"
            name: "photo"
            widget: "image"
            required: false
            hint: "Upload the Sheikh's actual photo (SVG/WebP/PNG). If left empty, a placeholder image (geometric design) will be used."
          - label: "Credentials/Stats"
            name: "credentials"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: "Value (e.g. 15+)", name: "value", widget: "string" }
              - { label: "Description (e.g. Years of experience)", name: "label", widget: "string" }
          - { label: "Note", name: "note", widget: "text", required: false }
